name: ci

# Tests only. No deployment, no environments, no repository secrets, no write scopes.
# Railway (LifeOS-Shell-) and Netlify (lifeos011) deploy from master on their own;
# this workflow never deploys and never reads their credentials.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_BUILD: "20.20.2"   # netlify.toml NODE_VERSION = 20
  NODE_TEST: "22.23.3"

jobs:
  typecheck:
    name: typecheck (lifeos-api)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_BUILD }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build -w @lifeos/shared && npm run build -w @lifeos/experience-sdk && npm run build -w @lifeos/token-network
      - working-directory: apps/lifeos-api
        run: npx prisma generate && npx tsc --noEmit

  publication-integration:
    name: publication ingest + pull (Postgres) — gating
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: lifeos_ci }
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d lifeos_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PG: postgresql://ci:ci@127.0.0.1:5432/lifeos_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_TEST }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build -w @lifeos/shared && npm run build -w @lifeos/experience-sdk && npm run build -w @lifeos/token-network
      - working-directory: apps/lifeos-api
        run: npx prisma generate && DATABASE_URL="$PG" npx prisma db push --skip-generate
      - name: publication-ingest.integration (17 tests expected, none skipped)
        working-directory: apps/lifeos-api
        env:
          LIFEOS_PG_TEST_URL: ${{ env.PG }}
        run: |
          # The spec reporter is pinned: Node 22 defaults to TAP when output is not a terminal.
          npx tsx --test --test-reporter=spec test/publication-ingest.integration.test.ts 2>&1 | tee "$RUNNER_TEMP/int.log"
          grep -Eq '^ℹ pass 17$' "$RUNNER_TEMP/int.log" && grep -Eq '^ℹ skipped 0$' "$RUNNER_TEMP/int.log"
      - name: Report failing tests as annotations
        if: failure()
        run: bash .github/ci/annotate-failures.sh "$RUNNER_TEMP/int.log"

  full-suite-baseline:
    name: full API suite vs documented baseline (fails on NEW failures)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: lifeos_sprint }
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d lifeos_sprint"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PG_SPRINT: postgresql://ci:ci@127.0.0.1:5432/lifeos_sprint
      PG_INT: postgresql://ci:ci@127.0.0.1:5432/lifeos_int
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_TEST }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build -w @lifeos/shared && npm run build -w @lifeos/experience-sdk && npm run build -w @lifeos/token-network
      - name: Disposable databases (seeded sprint DB + separate integration DB)
        working-directory: apps/lifeos-api
        run: |
          PGPASSWORD=ci psql -h 127.0.0.1 -U ci -d lifeos_sprint -c "create database lifeos_int"
          npx prisma generate
          DATABASE_URL="$PG_SPRINT" npx prisma db push --skip-generate
          DATABASE_URL="$PG_INT" npx prisma db push --skip-generate
          DATABASE_URL="$PG_SPRINT" npx tsx prisma/seed.ts
      - name: Start the seeded API on 127.0.0.1:8790 (sprint tests call it)
        working-directory: apps/lifeos-api
        run: |
          DATABASE_URL="$PG_SPRINT" PORT=8790 HOST=127.0.0.1 NODE_ENV=development LIFEOS_AUTH_BYPASS=true \
            LIFEOS_PUBLICATION_INGEST_SECRET="ci-$(openssl rand -hex 24)" MYBRANDOS_API_URL=http://127.0.0.1:9 \
            nohup npx tsx src/index.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          curl --retry 60 --retry-connrefused --retry-delay 2 -fsS http://127.0.0.1:8790/health > /dev/null
      - name: Run the full suite
        working-directory: apps/lifeos-api
        env:
          DATABASE_URL: ${{ env.PG_SPRINT }}
          LIFEOS_PG_TEST_URL: ${{ env.PG_INT }}
        run: npx tsx --test --test-concurrency=1 --test-reporter=spec test/*.test.ts > "$RUNNER_TEMP/suite.log" 2>&1 || true
      - name: Annotate failures (baseline entries as warnings, anything else as errors)
        if: always()
        run: bash .github/ci/annotate-failures.sh "$RUNNER_TEMP/suite.log" .github/ci/lifeos-known-failures.txt
      - name: Compare with the 11 documented baseline failures (min 129 tests)
        run: bash .github/ci/compare-baseline.sh "$RUNNER_TEMP/suite.log" .github/ci/lifeos-known-failures.txt 129
