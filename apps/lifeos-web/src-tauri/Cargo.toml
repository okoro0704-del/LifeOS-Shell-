[package]
name = "lifeos-desktop"
version = "1.0.0"
description = "LifeOS — Unified Workspace desktop shell"
authors = ["LifeOS"]
edition = "2021"

[lib]
name = "lifeos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
